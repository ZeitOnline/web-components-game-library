<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <script>
      // Same convention as the ZON frame: html.color-scheme-dark / -light override the system setting.
      try {
        const t = localStorage.getItem('color-scheme');
        if (t) document.documentElement.classList.add('color-scheme-' + t);
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
